<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juanfax - Login / Registro</title>
    <link rel="stylesheet" href="./estilos/css/Login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link href='https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <main class="contenedor-principal">
        <div class="tarjeta-login">
            
            <div id="bloqueLogin">
                <div class="tarjeta-login__encabezado">
                    <div class="tarjeta-login__logo">JFX</div>
                    <h1 class="tarjeta-login__titulo">Bienvenido</h1>
                    <p class="tarjeta-login__subtitulo">Ingresa a tu cuenta</p>
                </div>

                <form class="formulario-login" id="formulario_login" action="LoginServlet" method="POST">
                    <div class="formulario-login__grupo">
                        <label class="formulario-login__etiqueta" for="formularioCorreo">Correo electrónico</label>
                        <input class="formulario-login__campo" id="formularioCorreo" name="correo_electronico" type="email" placeholder="tu@correo.com" required>
                    </div>
                    <div class="formulario-login__grupo">
                        <label class="formulario-login__etiqueta" for="formularioContraseña">Contraseña</label>
                        <input class="formulario-login__campo" id="formularioContraseña" name="txtPass" type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" name="accion" class="formulario-login__boton" id="formulario-login__boton" value="Ingresar">
                        Iniciar Sesión
                    </button>
                </form>


                <div class="enlace-registro">
                    ¿No tienes cuenta? <a href="#" id="enlaceIrARegistro" class="enlace-registro__link">Regístrate aquí</a>
                </div>
            </div>


            <div id="bloqueRegistro" class="oculto">
                <div class="tarjeta-login__encabezado">
                    <div class="tarjeta-login__logo">JFX</div>
                    <h1 class="tarjeta-login__titulo">Únete a Nosotros</h1>
                    <p class="tarjeta-login__subtitulo">Crea tu cuenta en Juanfax</p>
                </div>

                <form class="formulario-login" id="formRegistro" action="LoginServlet" method="POST">
                    
                    <div class="formulario-login__grupo">
                        <label class="formulario-login__etiqueta" for="regNombre">Nombre Completo</label>
                        <input class="formulario-login__campo" id="regNombre" name="nombre_completo" type="text" placeholder="Ej. Juan David" required>
                    </div>
                    
                    <div class="formulario-login__grupo">
                        <label class="formulario-login__etiqueta" for="regCorreo">Correo electrónico</label>
                        <input class="formulario-login__campo" id="regCorreo" name="correo" type="email" placeholder="tu@correo.com" required>
                    </div>
                    
                    <div class="formulario-login__grupo">
                        <label class="formulario-login__etiqueta" for="regPass">Contraseña</label>
                        <input class="formulario-login__campo" id="regPass" name="contrasena" type="password" placeholder="••••••••" required>
                    </div>

                    <div class="formulario-login__grupo">
                        <label class="formulario-login__etiqueta" for="regRol">¿Cómo quieres usar Juanfax?</label>
                        <select class="formulario-login__campo" id="regRol" name="idRol" required style="cursor: pointer; background-color: transparent;">
                            <option value="" disabled selected hidden>Selecciona tu rol...</option>
                            <option value="3" style="color: #000;">Quiero buscar negocios (Cliente)</option>
                            <option value="2" style="color: #000;">Quiero registrar mi negocio (Vendedor)</option>
                        </select>
                    </div>

                    <div class="formulario-login__opciones" style="justify-content: flex-start; gap: 8px; margin-bottom: 15px;">
                        <input type="checkbox" id="regTerminos" required>
                        <label for="regTerminos" class="formulario-login__etiqueta" style="margin-bottom: 0; cursor: pointer;">
                            Acepto los términos y condiciones
                        </label>
                    </div>

                    <button type="submit" class="formulario-login__boton">
                        Registrarse
                    </button>
                </form>

                <div class="enlace-registro">
                    ¿Ya tienes cuenta? <a href="#" id="enlaceIrALogin" class="enlace-registro__link">Inicia sesión aquí</a>
                </div>
            </div>

        </div>
    </main>

    <footer class="pie-pagina">
        @ 2026 JUANFAX. Todos los derechos reservados.
    </footer>
    <script src="scripts/login.js"></script>
    </body>
</html>
