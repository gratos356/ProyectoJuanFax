<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./estilos/css/Login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link href='https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <!-- CONTENEDOR PRINCIPAL -->
    <main class="contenedor-principal">
        <div class="tarjeta-login">
            <!-- ENCABEZADO DE LA TARJETA -->
            <div class="tarjeta-login__encabezado">
                <div class="tarjeta-login__logo">JFX</div>
                <h1 class="tarjeta-login__titulo">Bienvenido</h1>
                <p class="tarjeta-login__subtitulo">Ingresa a tu cuenta</p>
            </div>

            <!-- FORMULARIO -->
            <form class="formulario-login" id="formulario_login" action="LoginServlet" method="POST">
                <div class="formulario-login__grupo">
                    <label class="formulario-login__etiqueta" for="correo">Correo electrónico</label>
                    <input class="formulario-login__campo" id="formularioCorreo" name="correo_electronico" type="email" id="correo" placeholder="tu@correo.com">
                </div>
                <div class="formulario-login__grupo">
                    <label class="formulario-login__etiqueta" for="contrasena">Contraseña</label>
                    <input class="formulario-login__campo" id="formularioContraseña" name="txtPass" type="password" id="contrasena" placeholder="••••••••">
                </div>
                <div class="formulario-login__opciones">
                    <div class="formulario-login__recordar">
                        <input type="checkbox" id="recordar">
                        <label for="recordar">Recordarme</label>
                    </div>
                    <a href="#" class="formulario-login__enlace">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" name="accion" class="formulario-login__boton" id="formulario-login__boton" value="Ingresar">
                    Iniciar Sesión
                </button>
            </form>

            <!-- DIVISOR -->
            <div class="divisor">
                <span class="divisor__texto">O continúa con</span>
            </div>

            <!-- LOGIN SOCIAL -->
            <div class="login-social">
                <button class="login-social__boton">Google</button>
                <button class="login-social__boton">GitHub</button>
            </div>

            <!-- ENLACE REGISTRO -->
            <div class="enlace-registro">
                ¿No tienes cuenta? <a href="#" class="enlace-registro__link">Regístrate aquí</a>
            </div>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="pie-pagina">
        @ 2026 JUANFAX. Todos los derechos reservados.
    </footer>

</body>
</html>
