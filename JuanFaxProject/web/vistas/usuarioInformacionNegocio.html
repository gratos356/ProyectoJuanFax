<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../estilos/css/usuarioInformacionNegocio.css">
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>
<body>
    <header class="headerContainer" id="headerContainer">
        <div class="logo"></div>
        <nav class="navContainer" id="navContainer">
            <button class="back bx-reply-big" id="back">
            </button>
        </nav>
    </header>
    <main class="principalContainer" id="principalContainer">
        <input type="hidden" id="idNegocioActual" value="">

        <div class="imagenNegocio" id="imagenNegocio"></div>
        <div class="nombreNegocio" id="nombreNegocio"></div>
        <div class="descripcionNegocio" id="descripcionNegocio"></div>
        <div class="showMap" id="showMap"></div>
    </main>
    <section class="comentariosContainer" id="comentariosContainer">
        <h2>Comentarios y Reseñas</h2>
        
        <form id="formComentario" class="formComentario">
            <div class="estrellas-rating">
                <input type="radio" id="star5" name="puntuacion" value="5" required>
                <label for="star5"  title="5 estrellas"><i class="bx-star"></i></label>
                
                <input type="radio" id="star4" name="puntuacion" value="4">
                <label for="star4"  title="4 estrellas"><i class="bx-star"></i></label>
                
                <input type="radio" id="star3" name="puntuacion" value="3">
                <label for="star3"  title="3 estrellas"><i class="bx-star"></i></label>
                
                <span class="ayuda-rating">(Selecciona tu puntuación)</span>
            </div>

            <input class="inputComentarios" id="txtComentario" placeholder="Escribe tu reseña sobre este negocio..." required>
            <button type="submit">Publicar Comentario</button>
        </form>

        <div class="listaComentarios" id="listaComentarios">
            <div class="comentarioCard">
                <p class="usuarioNombre"><strong>Juan David</strong> <span class="fecha">24/05/2026</span></p>
                <p class="comentarioTexto">¡Los mejores raspados de Girón! Súper recomendado.</p>
            </div>
        </div>
    </section>
    <footer class="footerContainer" id="footerContainer">

    </footer>
    <script src="../scripts/usuarioInformacionnegocio.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCe5D2_FnExQjPtuVccNEwFURjB7RKdLlY"></script>
</body>
</html>
