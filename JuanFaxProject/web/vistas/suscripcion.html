<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../estilos/css/vendedor.css">
</head>
<body>
    <section class="vista-suscripcion" id="vistaSuscripcion">
        <h2>Gestión de Suscripción</h2>
        <div class="card-plan-actual">
            <h3>Tu Plan: <span id="nombrePlan">Ejecutivo</span></h3>
            <p>Estado: <strong id="estadoPlan" style="color: green;">Activo</strong></p>
            <p>Vence el: <span id="fechaVencimiento">2026-06-10</span></p>
        </div>

        <div class="opciones-suscripcion">
            <button class="btn-primary" onclick="gestionarPlan('renovar')">Renovar Plan</button>
            <button class="btn-secondary" onclick="gestionarPlan('cambiar')">Cambiar Plan</button>
        </div>
        <div class="historial-pagos-seccion" style="margin-top: 20px;">
            <h3>Historial de Transacciones</h3>
            <table id="tablaHistorialPagos" border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>ID Transacción</th>
                        <th>Monto</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </section>
    <script src="../scripts/suscripcion.js"></script>
</body>
</html>
