<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../estilos/css/user.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link href='https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <section class="container Dekstop">
        <header class="header">
            <div class="contenedor-logo-ubicacion-configuracion">
                <div class="Logo">
                    
                </div>
                <div class="configuracion ">
                    <div class="profile" id="profile"><p>JD</p></div>
                </div>

            </div>         
            
        </header>
        <section class="hero" id="hero">
            <button class="boton-hero left" id="Boton_Izquierda">‹</button>
                <div class="contenedorHero" id="HeroContent">
                    <div class="banner-hero">
                        
                    </div>
                    <div class="banner-hero">
                        
                    </div>
                    <div class="banner-hero">
                        
                    </div>
                    <div class="banner-hero">
                        
                    </div>
                    <div class="banner-hero">
                        
                    </div>
                </div>
            <button class="boton-hero right" id="Boton_Derecha">›</button>
        </section>
        <section class="turismo-desktop">
            <div class="titulo-turismo-desktop">
                <h2>Turismo</h2>
                <p>Descubre los mejores sitios para hacer turismo</p>
            </div>
            <div class="expanding-card" id="Historicos">
                <h2 class="titulos">Historicos</h2>
                <!-- <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div> -->
            </div>
            <div class="expanding-card" id="Recreativos">
                <h2 class="titulos">Recreativos</h2>
                <!-- <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div> -->
            </div>
            <div class="expanding-card" id="Balnearios">
                <h2 class="titulos">Balnearios</h2>
                <!-- <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div>
                <div class="targets-expanding"></div> -->
            </div>
        </section>
        
        <footer class="footer">
            
        </footer>
        <div id="modalPerfil" class="modal-perfil-overlay" style="display: none;">
            <div class="modal-perfil-card">
                <div class="modal-perfil-header">
                    <h2>⚙️ Mi Cuenta</h2>
                    <button type="button" id="btnCerrarModal" class="btn-cerrar-modal">&times;</button>
                </div>
                
                <div class="modal-perfil-body">
                    <form id="formMiPerfil">
                        <div class="perfil-grupo">
                            <label>Nombre Completo</label>
                            <input type="text" id="perfilNombre" required>
                        </div>
                        
                        <div class="perfil-grupo">
                            <label>Correo Electrónico</label>
                            <input type="email" id="perfilCorreo" required>
                        </div>
                        
                        <div class="perfil-badges">
                            <div>
                                <small>Rol Actual</small>
                                <span id="perfilRol">-</span>
                            </div>
                            <div>
                                <small>Estado</small>
                                <span id="perfilEstado">-</span>
                            </div>
                        </div>
                        
                        <div class="perfil-acciones-principales">
                            <button type="submit" class="btn-guardar-cambios">💾 Guardar Cambios</button>
                            <button type="button" id="btnLogOut" class="btn-logout">❌ Cerrar Sesión</button>
                        </div>
                    </form>
                </div>
                
                <div class="modal-perfil-footer">
                    <p>¿Ya no deseas usar Juanfax?</p>
                    <button type="button" id="btnBorradoLogico" class="btn-baja-cuenta">⚠️ Dar de baja mi cuenta</button>
                </div>
            </div>
        </div>
    </section>
    <script src="../scripts/user.js"></script>
</body>
</html>
